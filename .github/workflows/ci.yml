# Configures the PC port (which proves the patches apply to the pinned decomp), builds it, and fails if any game code still errors.
name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc
      - name: Configure
        run: cmake --preset linux-gcc
      - name: Build
        run: cmake --build out/linux-gcc
      - name: Census must be zero
        run: |
          python3 tools/port_census.py out/linux-gcc > census.txt
          cat census.txt
          grep -q '^0 error(s) in' census.txt
